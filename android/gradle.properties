org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Dia chi VietRoad.Api ma app goi.
#  - May ao Android (emulator): 10.0.2.2 chinh la "localhost" cua may tinh.
#  - Dien thoai that: doi thanh IP LAN cua may tinh, vd http://192.168.1.10:5000/
vietroad.apiBaseUrl=http://10.0.2.2:5000/

# Kieu ban do MapLibre. OpenFreeMap: mien phi, khong can API key, du lieu OpenStreetMap.
# Kieu khac cua OpenFreeMap: .../styles/bright, .../styles/positron
vietroad.mapStyleUrl=https://tiles.openfreemap.org/styles/liberty
